<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-labelledby="t d">
<title id="t">Ciclo de resposta a incidentes</title>
<desc id="d">Quatro fases em ciclo: preparação, detecção e análise, contenção e recuperação, lições aprendidas, que alimentam de volta a preparação.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050A18"/><stop offset="1" stop-color="#0A1636"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.8"/><stop offset="0.5" stop-color="#1E3A8A" stop-opacity="0.4"/><stop offset="1" stop-color="#2563EB" stop-opacity="0.7"/></linearGradient>
<radialGradient id="gl" cx="500" cy="140.0" r="500.0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
<pattern id="gr" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#5B8CFF" stroke-opacity="0.06"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#67E8F9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="1" y="1" width="998" height="278" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="998" height="278" rx="22" fill="url(#gr)"/>
<rect x="1" y="1" width="998" height="278" rx="22" fill="url(#gl)"/>
<rect x="1" y="1" width="998" height="278" rx="22" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
<rect x="24" y="26" width="214" height="76" rx="14" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.6"/>
<circle cx="54" cy="64" r="15" fill="#07122E" stroke="#67E8F9" stroke-width="1.5"/>
<text x="54" y="69" text-anchor="middle" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#A5F3FC">1</text>
<text x="80" y="70" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#F0F7FF">Preparação</text>
<line x1="242" y1="64" x2="260" y2="64" stroke="#67E8F9" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="32" y="140" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#CFE3FF">Planos, papéis e</text>
<text x="32" y="164" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#CFE3FF">ferramentas prontos</text>
<text x="32" y="188" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#CFE3FF">antes do incidente</text>
<rect x="266" y="26" width="214" height="76" rx="14" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.6"/>
<circle cx="296" cy="64" r="15" fill="#07122E" stroke="#67E8F9" stroke-width="1.5"/>
<text x="296" y="69" text-anchor="middle" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#A5F3FC">2</text>
<text x="322" y="59" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#F0F7FF">Detecção e</text>
<text x="322" y="82" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#F0F7FF">análise</text>
<line x1="484" y1="64" x2="502" y2="64" stroke="#67E8F9" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="274" y="140" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#CFE3FF">Identificar o que</text>
<text x="274" y="164" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#CFE3FF">aconteceu, o alcance</text>
<text x="274" y="188" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#CFE3FF">e a gravidade</text>
<rect x="508" y="26" width="214" height="76" rx="14" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.6"/>
<circle cx="538" cy="64" r="15" fill="#07122E" stroke="#67E8F9" stroke-width="1.5"/>
<text x="538" y="69" text-anchor="middle" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#A5F3FC">3</text>
<text x="564" y="59" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#F0F7FF">Contenção e</text>
<text x="564" y="82" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#F0F7FF">recuperação</text>
<line x1="726" y1="64" x2="744" y2="64" stroke="#67E8F9" stroke-width="1.8" marker-end="url(#ar)"/>
<text x="516" y="140" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#CFE3FF">Isolar o problema,</text>
<text x="516" y="164" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#CFE3FF">remover a causa e</text>
<text x="516" y="188" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#CFE3FF">restaurar o serviço</text>
<rect x="750" y="26" width="214" height="76" rx="14" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.6"/>
<circle cx="780" cy="64" r="15" fill="#07122E" stroke="#67E8F9" stroke-width="1.5"/>
<text x="780" y="69" text-anchor="middle" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#A5F3FC">4</text>
<text x="806" y="59" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#F0F7FF">Lições</text>
<text x="806" y="82" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="800" fill="#F0F7FF">aprendidas</text>
<text x="758" y="140" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#CFE3FF">Revisar o que falhou</text>
<text x="758" y="164" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#CFE3FF">e melhorar controles</text>
<text x="758" y="188" text-anchor="start" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#CFE3FF">e processos</text>
<path d="M857,212 V232 H131 V214" fill="none" stroke="#67E8F9" stroke-opacity="0.7" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#ar)"/>
<rect x="388" y="220" width="224" height="26" rx="13" fill="#050A18" stroke="#22D3EE" stroke-opacity="0.5"/>
<text x="500" y="238" text-anchor="middle" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#A5F3FC" letter-spacing="1.5">MELHORIA CONTÍNUA</text>
</svg>