<rect x="520" y="20" width="460" height="420" rx="20" fill="url(#gr)"/>
<rect x="520" y="20" width="460" height="420" rx="20" fill="url(#gl)"/>
<rect x="520" y="20" width="460" height="420" rx="20" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
<rect x="544" y="42" width="46" height="46" rx="13" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.55"/>
<g transform="translate(567 65) scale(0.85)"><g fill="none" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-10,-8 L0,0 M10,-8 L0,0 M-10,9 L0,0 M10,9 L0,0 M-10,-8 L-10,9 M10,-8 L10,9"/><circle cx="0" cy="0" r="3.2" fill="#07122E"/><circle cx="-10" cy="-8" r="3" fill="#07122E"/><circle cx="10" cy="-8" r="3" fill="#07122E"/><circle cx="-10" cy="9" r="3" fill="#07122E"/><circle cx="10" cy="9" r="3" fill="#07122E"/></g></g>
<text x="606" y="72" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#22D3EE" letter-spacing="3">PROTEGER A IA</text>
<line x1="544" y1="108" x2="956" y2="108" stroke="#5B8CFF" stroke-opacity="0.25"/>
<circle cx="564" cy="148" r="15" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.6"/>
<text x="564" y="153" text-anchor="middle" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#A5F3FC">1</text>
<text x="596" y="146" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F0F7FF">Prompt injection</text>
<text x="596" y="172" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9DB6DC">Instruções maliciosas escondidas em texto</text>
<circle cx="564" cy="222" r="15" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.6"/>
<text x="564" y="227" text-anchor="middle" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#A5F3FC">2</text>
<text x="596" y="220" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F0F7FF">Vazamento de dados</text>
<text x="596" y="246" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9DB6DC">Informação sensível em respostas ou treino</text>
<circle cx="564" cy="296" r="15" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.6"/>
<text x="564" y="301" text-anchor="middle" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#A5F3FC">3</text>
<text x="596" y="294" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F0F7FF">Excesso de autonomia</text>
<text x="596" y="320" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9DB6DC">Agentes com permissões demais</text>
<circle cx="564" cy="370" r="15" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.6"/>
<text x="564" y="375" text-anchor="middle" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#A5F3FC">4</text>
<text x="596" y="368" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F0F7FF">Ataques adversariais</text>
<text x="596" y="394" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9DB6DC">Entradas ou dados feitos para enganar</text>
