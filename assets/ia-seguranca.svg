<rect x="20" y="20" width="460" height="420" rx="20" fill="url(#gr)"/>
<rect x="20" y="20" width="460" height="420" rx="20" fill="url(#gl)"/>
<rect x="20" y="20" width="460" height="420" rx="20" fill="none" stroke="url(#bd)" stroke-width="1.5"/>
<rect x="44" y="42" width="46" height="46" rx="13" fill="#22D3EE" fill-opacity="0.10" stroke="#22D3EE" stroke-opacity="0.55"/>
<g transform="translate(67 65) scale(0.85)"><g fill="none" stroke="#67E8F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0,-14 L11,-10 V1 C11,8 6,12 0,15 C-6,12 -11,8 -11,1 V-10 Z"/><path d="M-4.5,1 L-1,4.5 L5,-3"/></g></g>
<text x="106" y="72" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#22D3EE" letter-spacing="3">IA PARA DEFENDER</text>
<line x1="44" y1="108" x2="456" y2="108" stroke="#5B8CFF" stroke-opacity="0.25"/>
<circle cx="64" cy="148" r="15" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.6"/>
<text x="64" y="153" text-anchor="middle" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#A5F3FC">1</text>
<text x="96" y="146" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F0F7FF">Detecção de anomalias</text>
<text x="96" y="172" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9DB6DC">Logs e tráfego de rede fora do padrão</text>
<circle cx="64" cy="222" r="15" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.6"/>
<text x="64" y="227" text-anchor="middle" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#A5F3FC">2</text>
<text x="96" y="220" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F0F7FF">Classificação</text>
<text x="96" y="246" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9DB6DC">Phishing, spam e malware</text>
<circle cx="64" cy="296" r="15" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.6"/>
<text x="64" y="301" text-anchor="middle" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#A5F3FC">3</text>
<text x="96" y="294" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F0F7FF">Análise de comportamento (UEBA)</text>
<text x="96" y="320" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9DB6DC">Contas com atividade incomum</text>
<circle cx="64" cy="370" r="15" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.6"/>
<text x="64" y="375" text-anchor="middle" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#A5F3FC">4</text>
<text x="96" y="368" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F0F7FF">Triagem de alertas</text>
<text x="96" y="394" font-family="Inter, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#9DB6DC">LLM resume incidentes; humano revisa</text>
